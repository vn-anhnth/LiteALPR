[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "litealpr"
version = "0.1.3"
description = "Accurate and Efficient General OCR System for License Plates"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GNU Affero General Public License v3.0 (AGPL-3.0)"}
authors = [
    {name = "Anh Nguyen", email = "anhnth.25ai@ou.edu.vn"}
]
keywords = [
    "alpr",
    "ocr",
    "automatic-license-plate-recognition",
    "automatic-number-plate-recognition",
    "computer-vision",
    "license-plate-recognition",
    "onnxruntime",
    "plate-recognition",
    "yolov8",
    "python",
    "litealpr",
    "plate-detection",
    "realtime",
    "svtr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy<2.0",
    "opencv-python<=5.0.0.93",
    "pyyaml<=6.0.3",
    "huggingface-hub<=0.31",
    "torch>=1.7.0",
    "torchvision",
    "ultralytics<=8.3.99",
    "onnx>=1.13.0",
]

[project.optional-dependencies]
cpu = [
    "onnxruntime>=1.13.0",
]
gpu = [
    "onnxruntime-gpu>=1.13.0",
]

[project.urls]
"Homepage" = "https://github.com/vn-anhnth/LiteALPR"
"Documentation" = "https://github.com/vn-anhnth/LiteALPR/tree/main/docs"
"Bug Reports" = "https://github.com/vn-anhnth/LiteALPR/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["litealpr*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.yml", "*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py38"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "dataset",
    "weights",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E741",  # ambiguous variable name
    "E402",  # module level import not at top of file (needed for sys.path manipulation)
]

[tool.ruff.lint.isort]
known-first-party = ["litealpr"]
